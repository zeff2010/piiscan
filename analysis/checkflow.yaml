# =============================================================================
# App 个人信息保护合规检测 —— 标准作业流程（SOP）
# -----------------------------------------------------------------------------
# 这份文件是「检测流程」的唯一定义源，不是代码。
# 它把人工检测员的真实工作方式固化下来，让 AI 接管其中
# 「查看 → 比对 → 判定」三个环节，人工只做复核与取证。
#
# 人工原话（流程来源）：
#   1. 沙箱安装运行启动 App；沙箱自带静态分析，随时可看 minSdk 等静态参数
#   2. 老手会先停一会儿，在**不同意**隐私政策的前提下尽量多点各种按钮和链接
#      （此时坚决不能同意），看沙箱记录的行为；涉及采集个人信息的一律算
#      「未经用户同意收集」，导出堆栈作为证据
#   3. 把隐私政策、SDK 清单等的链接都记录下来，以便后续分析
#   4. 同意隐私政策后，**清除一次沙箱行为记录缓存**，确保后续都是同意后行为
#   5. 遍历各种功能页面，重点是需要用户填报信息、需要授予权限的功能：
#      关注填报哪些信息、权限是否提前要求、要求授权时有没有同步告知目的
#   6. 对照隐私政策：App 自身采集的、SDK 采集的，是否都能在政策或 SDK 共享
#      清单里找到；找不到就说明政策写的不全，可以开问题
#   7. 收集到的问题对应到报告模板的项里；没测到的项再逐项检测
#   8. 清除 App 数据复原到新安装状态，对所有问题复现确认并补充截图
#   9. 新手路径：直接按报告模板逐项测，中间可能需要多次清数据复原
#
# 设计原则：
#   · 阶段之间必须有明确的**边界**，尤其是「同意」这条线
#   · 每个阶段的产出是**证据**，不是结论；结论由判定层出
#   · 覆盖不到的项不许留白，必须显式写「跳过未测」并注明原因
# =============================================================================

version: 1
updated: "2026-10-16"

meta:
  name: 专项行动 App 个人信息保护合规检测流程
  report_template: TPL_ACTION_20260713     # 输出的报告按这份模板的 22 项组织
  standards:
    - 《个人信息保护法》
    - 《App违法违规收集使用个人信息行为认定方法》
    - 《GB/T 42582-2023 信息安全技术 移动互联网应用程序(App)个人信息安全测评规范》
  modes:
    expert: 按阶段顺序走 P0→P7，效率优先（老手路径）
    checklist: 跳过 P1/P4 的自由探索，直接按报告 22 项逐项测（新手路径）
  principle: >
    自动化只替代「查看、比对、判定」三个环节；
    凡涉及价值判断（必要性、是否误导）的一律出「疑似」由人工复核，不直接定论。

# =============================================================================
# 阶段定义
# =============================================================================
phases:

  # ---------------------------------------------------------------------------
  - id: P0
    num: "零"
    name: 静态分析
    goal: 不运行 App，先把能直接读出来的静态事实全部取到，供后续各阶段随时查阅
    needs: [apk]
    steps:
      - 解析 AndroidManifest：package / versionName / versionCode / minSdkVersion / targetSdkVersion
      - 提取 uses-permission 权限声明清单（含危险权限标注）
      - 提取四大组件导出情况（exported=true 且无 permission 保护的）
      - 识别第三方 SDK（按包名前缀匹配）
      - 识别加固特征
      - 读取签名信息
      - 抽取 APK 内嵌的隐私政策 URL / 域名
      - 抽取敏感 API 静态调用点（用于指导动态 hook）
    produces: [manifest_facts, permissions, components, sdks, jiagu, signature, policy_urls, domains]
    feeds: [Q001, Q007, Q010, Q012, Q025]
    notes: 对应人工「在沙箱里随时可以看静态参数」。这一步不产生结论，只产生事实。

  # ---------------------------------------------------------------------------
  - id: P1
    num: "一"
    name: 首次运行·未同意阶段
    goal: 在用户尚未同意隐私政策的前提下，尽可能触发 App 的各种行为，把「同意前收集」全部抓出来
    needs: [device, frida, ai]
    guard:
      - 坚决不能点击任何「同意 / 接受 / 同意并继续」类按钮
      - 只能点「不同意 / 仅浏览 / 关闭 / 返回」以及中性功能入口
      - 若弹窗只有「同意」可点（无拒绝选项），记录为 Q019 强制同意线索，然后停止本阶段
    steps:
      - 清除 App 数据，确保是全新安装状态
      - 冷启动并注入采集脚本
      - 静置观察（默认 20s），让后台自发行为先跑完
      - 由 AI 看截图指挥点击：遍历首屏/弹窗上的各种按钮与链接，尽量多点
      - 每一次点击都记录「点击了什么 → 触发了哪些敏感调用」
      - 导出命中调用的**完整堆栈**作为证据
    produces: [pre_consent_events, stacks, screenshots, taps]
    feeds: [Q002, Q003, Q010, Q012, Q017, Q019]
    consent_must_be: false      # ★ 硬约束：本阶段结束时 consent 必须为 false
    notes: >
      这是最容易出实质问题的阶段。判定规则也是最确定的：
      事件时间戳早于「同意事件」= 同意前收集，无需裁量。

  # ---------------------------------------------------------------------------
  - id: P2
    num: "二"
    name: 隐私政策与共享清单采集
    goal: 拿到隐私政策全文，并追查政策里指向的进一步链接（三方共享清单 / SDK 清单 / 个人信息清单）
    needs: [device, ai]
    steps:
      - 在首启弹窗或设置页中定位隐私政策入口（结构树取不到时用 AI 看截图 + 像素定位）
      - 打开政策页，从 WebView 里取正文（SPA 页面必须端上取，PC 端 curl 只能拿到空壳）
      - 读取政策页 DOM 里的全部超链接
      - 由 AI 判断哪些链接是「第三方共享清单 / SDK 清单 / 个人信息清单 / 儿童隐私政策」
      - 逐个打开下钻，取正文
      - 把全部链接记录进证据清单备查
    produces: [policy_text, policy_urls, drilled_docs, link_inventory]
    feeds: [Q001, Q005, Q006, Q007, Q008, Q009, Q013, Q014, Q015, Q016]
    notes: >
      政策只活几秒，观测必须在「点击瞬间」完成；
      正文在 WebView 里、可能藏在 iframe 或 textContent 中，必须 innerText+textContent+iframe 三路拼接。

  # ---------------------------------------------------------------------------
  - id: P3
    num: "三"
    name: 同意隐私政策（边界点）
    goal: 明确打出「同意」这个时间标记，并把此前的采集记录切断
    needs: [device, ai]
    steps:
      - 勾选同意（如需要）
      - 点击「同意并继续」
      - 记录同意事件的时间戳
      - ★ 清除行为记录缓存 —— 确保后续记录的都是同意之后的行为
    produces: [consent_event, cache_cleared]
    feeds: [Q002, Q003]
    consent_must_be: true
    notes: >
      「清缓存」是人工流程里最关键也最容易忘的一步。
      不清，同意前的行为会混进同意后的记录，导致 P5 对照分析整体失真。
      ★ 点完同意**不等于**到了主页面：应用通常还要经过开屏广告、年龄门、
      欢迎引导页、促销弹窗、兴趣选择，才进入可控的功能界面。这一段由
      **首启着陆（P3.5）**接管，见 `piiscan/landing.py`：只做"关闭/跳过/推进"
      三类动作，广告主体与兴趣标签一律不点，登录页不代填（有「随便逛逛」则点它）。
      P4 从它交出的界面开始遍历。

  # ---------------------------------------------------------------------------
  - id: P4
    num: "四"
    name: 同意后功能遍历
    goal: 遍历各功能页面，重点覆盖「要用户填报信息」和「要用户授予权限」两类场景
    needs: [device, frida, ai]
    focus:
      - 需要用户填报信息的页面：记录要求填报哪些信息
      - 需要授予权限的功能：记录是否提前要求、要求时是否同步告知目的
      - 个人信息相关入口：更正 / 删除 / 撤回同意 / 注销 / 投诉举报 / 个性化推荐开关
    steps:
      - 由 AI 看截图指挥：逐页遍历，优先去「我的 / 设置 / 个人资料 / 客服」等入口
      - 列表页：滚到底后上拉加载下一页（最多 2 次），逐项进入取证后返回
      - 定向期按 9 类权利入口扫描：只记录入口位置与文字，注销/删除类不实际执行
      - 遇到权限申请弹窗：截图，并记录弹窗前后的界面上下文（用于判断是否提前索权）
      - 遇到信息填报页：截图，记录字段标签
      - 遇到疑似问题的都截图备用
      - 全程记录行为（已清缓存，均属同意后）
      - 记录页面图与覆盖口径（已到达界面 / 未探索入口 / 中断原因），供报告「界面覆盖情况」引用
    produces: [post_consent_events, perm_scenes, form_scenes, screenshots, ui_paths, page_graph]
    feeds: [Q003, Q004, Q010, Q011, Q012, Q013, Q014, Q015, Q016, Q019, Q020, Q022, Q023, Q026]
    notes: >
      权限场景要记录「界面上下文」，否则无法区分
      「用到了才要」和「提前索要」—— 这是 Q012 判定的全部依据。
      ★ 起点是 P3.5 交出的**主页面**，不是"点完同意那一屏"。若 P3.5 未能
      进入主页面（例如登录墙），应从实际停留的界面开始，并在报告「首启着陆」
      一节写明卡在哪 —— 未覆盖的原因必须落到具体环节，不能只写"未覆盖"。

  # ---------------------------------------------------------------------------
  - id: P5
    num: "五"
    name: 政策对照分析
    goal: 把实际观测到的收集行为，与政策/SDK清单的声明做差集，找出「做了但没写」的项
    needs: [policy, events]
    steps:
      - 把采集到的行为映射成「个人信息类型」集合 A（signal_map 的 pi 字段）
      - 从政策正文解析出「声明收集范围」集合 B
      - 从 SDK 清单解析出「第三方共享声明」集合 C
      - 差集 A - B：实际收集但政策未列明 → Q006 / Q005 / Q001
      - 第三方 SDK 实际外发但 C 中查无此项 → Q007
      - 由 AI 对差集逐条做语义复核，排除「表述不同但含义相同」的假差集
    produces: [pi_collected, pi_declared, sdk_declared, gaps]
    feeds: [Q001, Q005, Q006, Q007, Q008]
    notes: >
      差集是机械算的，但「同义表述」必须靠 AI 复核，
      否则「设备标识符」vs「设备唯一标识」会被误报成未列明 —— 这是本阶段唯一的误报源。

  # ---------------------------------------------------------------------------
  - id: P6
    num: "六"
    name: 逐项检测（补齐未覆盖项）
    goal: 对 P1~P5 没覆盖到的测评项逐项检测；确实测不了的写「跳过未测」
    needs: [all]
    steps:
      - 汇总 P1~P5 已覆盖的测评项
      - 对未覆盖项逐项执行检测（能自动的自动，需人工的标出）
      - 输出测评项状态表：发现问题 / 未发现问题 / 疑似 / 跳过未测
    produces: [checkitem_states]
    feeds: [ALL]
    notes: >
      新手路径可以在这里直接按报告 22 项逐项走，跳过 P1/P4 的自由探索。

  # ---------------------------------------------------------------------------
  - id: P7
    num: "七"
    name: 复现确认
    goal: 复原到新安装状态，按首轮记录的点击路径重放一轮，确认问题项可稳定重现并补齐截图
    needs: [device, frida, ai]
    steps:
      - 清除 App 数据，复原到新安装状态
      - 首启 → 政策 → 同意 → 登录照旧重做（清数据后必须重走，这段不属于重放）
      - 按首轮记录的点击路径逐步重放（tap/back/swipe/pull 照抄顺序，不调模型、不做新决策）
      - 判断据是否再次出现：同一调用 / 同一类信息 / 同一权限 / 同一政策获取结论
      - 复现成功：截图 + 堆栈，标记为「确证」
      - 复现失败：保留为「疑似」，注明未能复现
      - 重放没走完（漂移 / 超时 / 应用退出）：对应项记「未能判定」，状态不动
    produces: [repro_results, repro_replay, screenshots, stacks]
    feeds: [ALL]
    notes: >
      这一步是人工流程里的最后一道关。
      自动化可以省掉重复劳动，但不能省掉这一步本身 —— 不复现的问题不能进正式报告。
      ★ 为什么是「重放路径」而不是「重新探索」：两轮走的界面不同时，"判据没出现"
      分不清是"问题不再发生"还是"这轮没走到那屏"，后者会把 fail 误降成 suspect。
      重放同一路径还有个副产品：首轮每步等模型的 2~3 秒不再重复花。

# =============================================================================
# 报告输出项（严格对应 TPL_ACTION_20260713 模板的 22 项）
# =============================================================================
# 说明：模板是 22 项，测评项库是 25 项。一份报告项可能对应多个测评项
#      （例如「未经用户同意收集」同时覆盖「同意前收集」和「超授权范围」）。
#      输出以模板为准，测评项只作为内部证据来源。
# =============================================================================
report_items:

  - num: 1
    title: 未公开收集使用规则
    standard: App违法违规收集使用个人信息行为认定方法
    clause: ""
    unit: ""
    conclusion: 未公开收集使用规则
    checks: [Q001]
    phases: [P0, P2, P5]
    auto: L2

  - num: 2
    title: 处理不满十四周岁未成年人个人信息，未制定专门的个人信息处理规则，未取得未成年人父母或其他监护人的同意
    standard: GB/T 42582-2023 信息安全技术 移动互联网应用程序(App)个人信息安全测评规范
    clause: "6.1.4.4"
    unit: PIC-22
    conclusion: 处理不满十四周岁未成年人个人信息，未制定专门的个人信息处理规则，未取得未成年人父母或其他监护人的同意
    checks: [Q009]
    phases: [P2, P6]
    auto: L2

  - num: 3
    title: 未经用户同意收集使用个人信息
    standard: GB/T 42582-2023 信息安全技术 移动互联网应用程序(App)个人信息安全测评规范
    clause: "6.1.4.1"
    unit: PIC-19
    conclusion: 未经用户同意收集使用个人信息
    checks: [Q002, Q003]
    phases: [P1, P3, P4]
    auto: L1
    example: 首次打开APP，用户同意隐私政策前，APP收集了XXXX等信息 / 在XXX场景下APP收集了XXX信息，但未在隐私政策中列明并取得用户同意

  - num: 4
    title: 未完整准确告知收集使用个人信息情况，或告知收集使用个人信息目的、方式、范围与实际收集使用情况不一致
    standard: GB/T 42582-2023 信息安全技术 移动互联网应用程序(App)个人信息安全测评规范
    clause: "6.1.4.1"
    unit: PIC-19
    conclusion: 未完整准确告知收集使用个人信息情况，或告知收集使用个人信息目的、方式、范围与实际收集使用情况不一致
    checks: [Q005, Q006]
    phases: [P5, P6]
    auto: L2
    example: 隐私政策中虽然列出了APP自身采集XXX信息，但是缺少收集场景/缺少处理目的/缺少保存期限/与实际收集使用情况不一致

  - num: 5
    title: 未列明向第三方提供个人信息的种类、目的、方式以及接收方的名称、联系方式
    standard: GB/T 42582-2023 信息安全技术 移动互联网应用程序(App)个人信息安全测评规范
    clause: "6.1.4.1"
    unit: PIC-19
    conclusion: 未列明向第三方提供个人信息的种类、目的、方式以及接收方的名称、联系方式
    checks: [Q007]
    phases: [P0, P2, P5]
    auto: L2
    example: 隐私政策中虽然列出了XXX SDK采集XXX信息，但是缺少收集场景/缺少处理目的/缺少保存期限 / 缺少SDK的主体信息/联系方式

  - num: 6
    title: 未在个人信息处理规则中明确收集的个人信息用于广告、用户画像等功能
    standard: GB/T 42582-2023 信息安全技术 移动互联网应用程序(App)个人信息安全测评规范
    clause: "6.1.5.1"
    unit: PIC-26
    conclusion: 未在个人信息处理规则中明确收集的个人信息用于广告、用户画像等功能
    checks: [Q008]
    phases: [P5, P6]
    auto: L2
    example: 隐私政策中虽然列出了XXX广告SDK采集XXX信息，但是未明确收集的XXX个人信息用于广告、用户画像

  - num: 7
    title: 在申请打开可收集个人信息的权限或申请收集用户个人敏感信息时，未同步告知用户其目的
    standard: GB/T 42582-2023 信息安全技术 移动互联网应用程序(App)个人信息安全测评规范
    clause: "6.1.4.2"
    unit: PIC-20
    conclusion: 在申请打开可收集个人信息的权限或申请收集用户等个人敏感信息时，未同步告知用户其目的
    checks: [Q026]
    phases: [P4, P6]
    auto: L2
    example: 使用XXX功能时，APP申请了XXX权限 / APP收集了XXX敏感个人信息，但未同步告知用户其目的
    note: >
      人工报告中出现 30 次，属高频项。判定只取**这一次申请自带**的证据：
      系统弹窗内文字 + 弹窗出现前那一屏。两者都取到且都无用途说明，即认定；
      弹窗前那一屏没取到（结构树读不出）记「证据不足」，不判。
      **不看「抓到几次」**，也不用"会话里其他界面翻到过说明"来减轻结论 ——
      前者取决于本轮点开了几个会索权的功能，后者取决于遍历有没有翻到那张
      静态说明页，两处都会让同一个 App 的结论在不同轮次之间来回跳
      （实测：同一包同一版本六轮，「认定」与「疑似」在同一批证据上互换）。
      开测前另需收回运行时权限：`pm clear` 不动已授予的权限，不收回则
      下一轮不再弹窗，本项只能记「跳过未测」。

