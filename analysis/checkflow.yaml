states:
  not_tested:
    label: 跳过未测
    desc: 本次流程未获取到判定所需的证据，不做结论
  pass:
    label: 未发现问题
    desc: 已取得证据且未发现违反该项的情形
  suspect:
    label: 疑似
    desc: 发现线索但涉及价值判断，需人工复核
  fail:
    label: 发现问题
    desc: 证据充分，可支撑结论

