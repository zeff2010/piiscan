# ============================================================================
# 测评项知识库（可扩展）
# ----------------------------------------------------------------------------
# 依据 197 份人工检测报告（2026 年 5 个批次）与《GB/T 42582-2023》归纳而成。
#
# 用途：
#   1. 作为「自动判定引擎」的规则源 —— 每条规则描述"什么算问题"以及需要什么证据
#   2. 作为「报告渲染」的模板源 —— 输出措辞、法规引用、章节归属
#   3. 作为多模板扩展的基线 —— templates 段描述不同报告模板的差异
#
# automation 等级定义：
#   L1  全自动  —— 证据可完全自动采集，判定规则确定，可直接出结论（人工仅复核）
#   L2  半自动  —— 证据可自动采集，但判定含语义/裁量，AI 输出「疑似 + 完整证据链」
#   L3  辅助    —— 工具只能给出线索，定性几乎依赖人工
#   L4  暂不可自动化 —— 依赖漏洞挖掘/复杂业务语义/特殊硬件
#
# evidence 证据类型：
#   frida    运行时 API 调用 + 参数 + 返回值 + 调用栈 + 时序
#   manifest 静态权限声明 / SDK 声明
#   policy   隐私政策文本
#   ui       UI 元素 / 弹窗 / 交互路径
#   traffic  网络流量（域名、上报字段、明文判定）
#   code     反编译代码 / 二进制分析
#   manual   人工业务判断
# ============================================================================

version: 1
updated: "2026-10-15"

meta:
  source_reports: 196
  source_batches: 5
  standard: "GB/T 42582-2023 信息安全技术 移动互联网应用程序(App)个人信息安全测评规范"
  law: "个人信息保护法 / App违法违规收集使用个人信息行为认定方法"
  issuer: "公安部计算机信息系统安全产品质量监督检验中心"

# ---------------------------------------------------------------------------
# 一级类别（专项行动报告实际使用的 5 分类）
# ---------------------------------------------------------------------------
categories:
  - id: C1
    num: "一"
    name: 未提供个人信息收集使用规则
    desc: 未通过弹窗等明显方式提示用户阅读隐私政策；或政策不完整、无法访问
    observed: 30
  - id: C2
    num: "二"
    name: 未按照个人信息收集使用规则处理个人信息
    desc: 同意前收集、超出授权范围、实际与声明不一致
    observed: 12
  - id: C3
    num: "三"
    name: 无相关功能或未使用相关功能时调用位置、媒体文件、通讯录、设备等非必要权限或收集非必要个人信息
    desc: 无关场景调用、提前索权、超频次
    observed: 4
  - id: C4
    num: "四"
    name: 未经用户同意向他人提供个人信息
    desc: 共享给第三方未获同意或未告知
    observed: 0
  - id: C5
    num: "五"
    name: 未提供有效的更正删除个人信息及注销账号功能
    desc: 注销、更正、删除、撤回同意、投诉举报渠道缺失或不可用
    observed: 5

# ---------------------------------------------------------------------------
# 测评项明细
# ---------------------------------------------------------------------------
items:

  # ===================== C1 未提供个人信息收集使用规则 =====================
  - id: Q001
    title: 未公开收集使用规则
    category: C1
    basis: 依据《App违法违规收集使用个人信息行为认定方法》
    evidence: [ui, policy]
    collect: [uiwalk, policy_parse]
    automation: L2
    rule: |
      首启检测：启动后 N 秒内是否存在可被记录的隐私政策弹窗/首屏提示；
      政策文本是否可完整访问（含"仅提供指引、无法查看完整政策"的情形）。
    pain: 「明显方式」有裁量空间，弹窗识别需处理自定义 WebView / 小程序差异
    freq: 58

  - id: Q002
    title: 征得用户同意前就开始收集个人信息
    category: C2
    basis: GB/T 42582-2023 6.1.4.1 测评单元（PIC-19）
    evidence: [frida, ui]
    collect: [frida_hook, uiwalk]
    automation: L1
    rule: |
      建立「同意事件」时间轴；任何敏感 API 调用若时间戳早于同意事件，
      即判定为同意前收集。这是最确定、最可量化的规则。
    pain: 需要准确捕获「同意」动作本身（弹窗按钮点击）；小程序需另接
    freq: 97

  - id: Q003
    title: 未经用户同意收集使用个人信息
    category: C2
    basis: GB/T 42582-2023 6.1.4.1 测评单元（PIC-19）
    evidence: [frida, policy]
    collect: [frida_hook, policy_parse]
    automation: L2
    rule: |
      同意后观测到的收集行为，与隐私政策声明的收集项集合做差集；
      差集非空 → 疑似「收集了但未声明」。
    pain: 行为→个人信息类型的映射（如 getDeviceId → IMEI）需维护映射表；
          政策文本抽取的粒度影响召回率
    freq: 97

  - id: Q004
    title: 实际收集的个人信息超出用户授权范围
    category: C2
    basis: GB/T 42582-2023 6.1.4.1 测评单元（PIC-19）
    evidence: [frida, policy]
    collect: [frida_hook, policy_parse]
    automation: L2
    rule: 同 Q003，但侧重「政策已列该类型信息，但未覆盖该收集场景」
    pain: 需要场景归因（哪个界面触发的调用）
    freq: 7

  - id: Q005
    title: 未逐一列出收集、使用个人信息的目的、方式、范围
    category: C1
    basis: GB/T 42582-2023 6.1.4.1 测评单元（PIC-19）
    evidence: [policy, frida]
    collect: [policy_parse, frida_hook]
    automation: L2
    rule: |
      对政策中每个收集项检查四要素是否齐备：收集主体 / 场景 / 目的 / 保存期限。
      缺失任一项即疑似。
    pain: 「保存期限」「收集场景」的字段级抽取准确率是瓶颈
    freq: 7

  - id: Q006
    title: 未完整准确告知收集使用个人信息情况，或告知收集使用个人信息目的、方式、范围与实际收集使用情况不一致
    category: C2
    basis: GB/T 42582-2023 6.1.4.1 测评单元（PIC-19）
    evidence: [policy, frida]
    collect: [policy_parse, frida_hook]
    automation: L2
    rule: 政策声明的场景/方式 与 实测调用路径 逐项比对，出现矛盾即命中
    pain: 自然语言场景描述与实测路径的对齐需语义匹配
    freq: 7

  - id: Q007
    title: 未列明向第三方提供个人信息的种类、目的、方式以及接收方的名称、联系方式
    category: C4
    basis: GB/T 42582-2023 6.1.4.1 测评单元（PIC-19）
    evidence: [frida, policy, manifest, traffic]
    collect: [frida_hook, policy_parse, apk_scan, mitmproxy]
    automation: L2
    rule: |
      从 APK 提取内嵌 SDK 清单（包名/特征类）→ 与政策第三方清单比对；
      逐 SDK 检查是否列明 种类/目的/方式/接收方名称/联系方式 五要素。
    pain: SDK 识别依赖特征库，且 SDK 可动态下发/插件化
    freq: 6

  - id: Q008
    title: 未在个人信息处理规则中明确收集的个人信息用于广告、用户画像等功能
    category: C1
    basis: GB/T 42582-2023 6.1.5.1 测评单元（PIC-26）
    evidence: [policy, frida]
    collect: [policy_parse, frida_hook]
    automation: L2
    rule: 检测到广告/画像类 SDK 在收集行为，但政策未见「广告」「用户画像」用途表述
    pain: 关键词判定易漏，需结合 SDK 类型推断用途
    freq: 0

  - id: Q009
    title: 处理不满十四周岁未成年人个人信息，未制定专门的个人信息处理规则，未取得未成年人父母或其他监护人的同意
    category: C2
    basis: GB/T 42582-2023 6.1.4.4 测评单元（PIC-22）
    evidence: [policy, ui, frida]
    collect: [policy_parse, uiwalk, frida_hook]
    automation: L2
    rule: |
      两条路径：(a) 政策中是否含独立儿童个人信息保护规则；
      (b) 界面是否存在可录入未成年人身份信息的入口（如添加乘车人/儿童信息），
      且无监护人单独同意交互。
    pain: 需判断「录入的信息是否指向未成年人」，含语义
    freq: 6

  # ===================== C3 非必要权限 / 非必要收集 =====================
  - id: Q010
    title: 超出必要范围收集使用个人信息，在无关场景收集位置、通讯录、短信等个人信息
    category: C3
    basis: GB/T 42582-2023 6.1.2.2 测评单元（PIC-05）
    evidence: [manifest, frida, ui]
    collect: [apk_scan, frida_hook, uiwalk]
    automation: L2
    rule: |
      可判定部分：权限已声明但在 UI 遍历全过程中从未有对应功能被使用 → 提前索权；
      Manifest 声明了精确位置等敏感权限，但业务无需 → 超范围（需业务归类）。
    pain: 「必要范围」需按 App 类型对照 39 类规定，含裁量
    freq: 22

  - id: Q011
    title: 超出最低必要频率调用个人信息权限
    category: C3
    basis: GB/T 42582-2023 6.1.2.2 测评单元（PIC-05）
    evidence: [frida]
    collect: [frida_hook]
    automation: L1
    rule: 纯量化 —— 统计单位时间内调用次数，超过阈值（如位置每秒多次）即命中
    pain: 阈值需按权限类型设定基线
    freq: 0

  - id: Q012
    title: 提前要求用户打开非当前功能所需的可收集个人信息权限
    category: C3
    basis: GB/T 42582-2023 6.1.2.2 测评单元（PIC-05）
    evidence: [ui, frida]
    collect: [uiwalk, frida_hook]
    automation: L1
    rule: |
      记录每次权限申请弹窗出现时的界面/操作上下文；
      若申请发生在"无相关功能"的界面（如首启首页申请相机） → 命中。
    pain: 需要可靠的界面→功能归因
    freq: 4

  # ===================== C5 用户权利 =====================
  - id: Q013
    title: 未提供有效注销用户账号功能
    category: C5
    basis: GB/T 42582-2023 6.4.5.1 测评单元（RPI-11）
    evidence: [policy, ui]
    collect: [policy_parse, uiwalk]
    automation: L1
    rule: |
      三项独立可判定子规则：
      (a) 政策中是否给出注销路径 → 文本抽取；
      (b) UI 遍历是否找到注销入口且路径与政策一致 → 路径比对；
      (c) 承诺处理时间是否 > 15 个工作日 → 正则抽取；
      另含"设置不合理条件（注册满 X 天）"/"验证信息多于注册时"。
    pain: 注销流程通常需登录态，自动化测试需预置账号
    freq: 10

  - id: Q014
    title: 未有效建立、公布个人信息安全投诉举报渠道
    category: C5
    basis: GB/T 42582-2023 6.4.8 测评单元（RPI-24）
    evidence: [policy, ui]
    collect: [policy_parse, uiwalk]
    automation: L1
    rule: |
      纯政策文本判定：(a) 是否提供投诉举报渠道（邮箱/电话/在线入口）；
      (b) 是否明确承诺处理时间；(c) 处理时间是否 > 15 个工作日。
    pain: 几乎无技术难度，是投入产出比最高的一项
    freq: 17

  - id: Q015
    title: 未向用户提供行使更正、删除、拒绝处理个人信息等权利的便捷渠道，相关功能不完善不健全
    category: C5
    basis: GB/T 42582-2023 6.4.3.1 测评单元（RPI-05）
    evidence: [policy, ui]
    collect: [policy_parse, uiwalk]
    automation: L1
    rule: |
      四要素检查：更正途径 / 删除途径 / 撤回同意途径 / 承诺处理时间。
      前三条可从政策文本 + UI 遍历双路验证。
    pain: 与 Q014 高度重叠，注意去重
    freq: 11

  - id: Q016
    title: 未提供删除用户个人特征标签等功能
    category: C5
    basis: GB/T 42582-2023 6.1.2.3 测评单元（PIC-06）
    evidence: [policy, ui]
    collect: [policy_parse, uiwalk]
    automation: L2
    rule: 存在个性化推荐功能时，检查是否有「删除用户标签」入口
    pain: 需先判定是否存在画像/标签体系
    freq: 0

  # ===================== 广告类 =====================
  - id: Q017
    title: 开屏等场景频繁“意外”跳转广告页面
    category: C1
    basis: GB/T 42582-2023 6.1.1.1 测评单元（PIC-01）
    evidence: [ui]
    collect: [uiwalk, screenrecord]
    automation: L2
    rule: |
      可量化部分：UI 遍历过程中统计广告页出现次数/频率，超过阈值即疑似；
      同时检查广告关闭按钮是否存在、是否被隐藏。
    pain: 「意外」「频繁」阈值需定义；广告页识别依赖 UI 特征库
    freq: 4

  - id: Q018
    title: 广告存在误导、欺骗用户行为
    category: C1
    basis: GB/T 42582-2023 6.1.1.1 测评单元（PIC-01）
    evidence: [ui, manual]
    collect: [uiwalk, screenrecord]
    automation: L3
    rule: |
      工具可自动上报：关闭按钮尺寸/位置/延迟出现时间、是否全屏跳转、
      高敏感触发（摇一摇）、文案是否含"领红包"等诱导词。
      最终定性仍需人工（涉及"误导"的主观判断）。
    pain: 主观性强，适合做「线索聚合」而非结论
    freq: 0

  # ===================== 强制同意类 =====================
  - id: Q019
    title: 强制用户同意收集非必要个人信息
    category: C2
    basis: GB/T 42582-2023 6.1.2.1 测评单元（PIC-04）
    evidence: [ui]
    collect: [uiwalk]
    automation: L2
    rule: |
      自动化可做：拒绝权限/拒绝隐私政策后，遍历检查主流程是否被阻断；
      被阻断的功能是否属于"非必要"需业务判断。
    pain: 需区分「拒绝后不能用该功能」（合理）与「拒绝后不能用 App」（违规）
    freq: 2

  - id: Q020
    title: 不合理地强制要求用户注册、登录，强制收集手机号等个人信息
    category: C2
    basis: GB/T 42582-2023 6.1.2.1 测评单元（PIC-04）
    evidence: [ui, manual]
    collect: [uiwalk]
    automation: L3
    rule: 遍历检查是否有「游客/跳过」路径；是否可浏览主要功能
    pain: 「主要功能」是否依赖账号，需按业务类型判断
    freq: 0

  - id: Q021
    title: 使用非人脸识别技术方式可以实现验证身份，将人脸识别技术作为唯一验证方式
    category: C2
    basis: GB/T 42582-2023 6.1.2.1 测评单元（PIC-04）
    evidence: [ui, manual]
    collect: [uiwalk]
    automation: L4
    rule: 需真人配合完成人脸核验流程，且需判断「是否存在替代方案」
    pain: 触发人脸核验需要真实身份材料，自动化成本极高
    freq: 0

  # ===================== 个性化推荐 =====================
  - id: Q022
    title: 未设置易于理解、便于访问和操作的个性化推荐关闭选项
    category: C5
    basis: GB/T 42582-2023 6.3.5.3 测评单元（UPI-14）
    evidence: [ui, policy]
    collect: [uiwalk, policy_parse]
    automation: L2
    rule: 遍历设置项查找「个性化推荐」开关；检查进入层级是否过深
    pain: 「易于理解、便于访问」含主观性
    freq: 1

  - id: Q023
    title: 个人关闭个性化推荐后未停止收集个人信息
    category: C5
    basis: GB/T 42582-2023 6.3.5.3 测评单元（UPI-14）
    evidence: [frida, ui]
    collect: [frida_hook, uiwalk]
    automation: L1
    rule: |
      可完全自动化：关闭开关 → 采集开关后的行为 → 若同类 SDK 仍在收集即命中。
      是"前后对比"型规则，证据力很强。
    pain: 需先自动定位到开关位置
    freq: 0

  # ===================== 安全类 =====================
  - id: Q024
    title: 存在个人信息泄露风险隐患
    category: C5
    basis: 依据《个人信息保护法》
    evidence: [traffic, code, manual]
    collect: [mitmproxy, jadx]
    automation: L4
    rule: 依赖具体漏洞（越权、明文传输、日志泄露、组件暴露等）
    pain: 本质是渗透测试，需按漏洞类型建立专项检测器，无法通用化
    freq: 0

  - id: Q025
    title: 未对个人信息采取加密、去标识化等安全技术措施
    category: C5
    basis: GB/T 42582-2023 6.2.3.1 测评单元（PIS-04）
    evidence: [traffic, frida]
    collect: [mitmproxy, frida_hook]
    automation: L3
    rule: |
      mitmproxy 解密后检查上报字段是否含明文手机号/身份证/设备号；
      也可从 hooks 观察 put 到请求体的字段是否未经加密。
    pain: 大部分流量为 HTTPS，判定「是否加密」需区分传输加密与应用层加密
    freq: 1

  # -----------------------------------------------------------------------
  # Q026 是 2026-10-16 补的：对照报告模板（TPL_ACTION_20260713）逐项核对时发现，
  # 模板第 7 项「在申请打开可收集个人信息的权限或申请收集用户个人敏感信息时，
  # 未同步告知用户其目的」在库里没有对应条目，而它在 196 份人工报告里出现 30 次，
  # 属高频项。原先最接近的 Q012「提前要求打开非当前功能所需权限」是另一回事：
  # Q012 判的是「时机不对」，Q026 判的是「告知不全」——权限要得没问题，
  # 但弹窗没说要来干什么，照样违规。
  # -----------------------------------------------------------------------
  - id: Q026
    title: 在申请打开可收集个人信息的权限或申请收集用户个人敏感信息时，未同步告知用户其目的
    category: C3
    basis: GB/T 42582-2023 6.1.4.2 测评单元（PIC-20）
    evidence: [ui, frida, policy]
    collect: [uiwalk, frida_hook]
    automation: L2
    rule: |
      抓到权限申请弹窗时，同时记录「弹窗前的界面上下文」与「弹窗上的文案」：
      ① 弹窗文案中若不含目的说明（"用于…""以便…""为向您提供…"等），判未同步告知；
      ② 若 App 自己在弹权限前弹过一个说明用途的对话框，视为已告知；
      ③ 敏感个人信息（身份证号、人脸、精确位置、通讯录等）的采集同样适用，
         只是证据形态换成「填报页字段旁有无用途说明」。
      判定需要界面上下文，因此依赖 UI 遍历时把权限弹窗前后的画面都截下来。
    pain: >
      权限弹窗由系统绘制（Android 权限对话框），uiautomator 能拿到包名和权限名，
      但拿不到「用户在哪个功能里触发的」——必须在弹窗前一步截图才能归因。
      App 自绘的用途说明对话框样式五花八门，只能靠 AI 看图判断。
    freq: 30

