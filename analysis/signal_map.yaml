signals:

# ---------------------------------------------------------------- 硬件标识
  - id: S001
    name: IMEI
    group: 硬件标识
    api:
      - "android.telephony.TelephonyManager#getImei()"
      - "android.telephony.TelephonyManager#getDeviceId()"
    pi: P01
    perm: READ_PHONE_STATE
    evidence: A
    confirm: 返回值非 null 且非 "unknown" 且非全 0
    fp: 低
    fp_note: Android 10+ 第三方应用无 READ_PRIVILEGED_PHONE_STATE，系统直接返回 null —— 取到 null 时不得计入
    policy_alias: [IMEI, 设备识别码, 设备唯一标识符, 国际移动设备识别码]

  - id: S002
    name: IMSI
    group: 硬件标识
    api:
      - "android.telephony.TelephonyManager#getSubscriberId()"
    pi: P01
    perm: READ_PHONE_STATE
    evidence: A
    confirm: 返回值非 null 且非空
    fp: 低
    fp_note: 同上，Android 10+ 多数返回 null
    policy_alias: [IMSI, 用户标识, 国际移动用户识别码]

  - id: S003
    name: MEID
    group: 硬件标识
    api:
      - "android.telephony.TelephonyManager#getMeid()"
    pi: P01
    perm: READ_PHONE_STATE
    evidence: A
    confirm: 返回值非 null 且非空
    fp: 低
    fp_note: 仅 CDMA 机型有效，GSM 机型返回 null 属正常
    policy_alias: [MEID, 设备识别码]

  - id: S004
    name: ICCID
    group: 硬件标识
    api:
      - "android.telephony.TelephonyManager#getSimSerialNumber()"
    pi: P01
    perm: READ_PHONE_STATE
    evidence: A
    confirm: 返回值非 null 且非空
    fp: 低
    fp_note: 无 SIM 卡时返回 null
    policy_alias: [ICCID, SIM卡号, SIM卡序列号]

  - id: S005
    name: 硬件序列号
    group: 硬件标识
    api:
      - "android.os.Build#getSerial()"
      - "android.os.SystemProperties#get()"
    pi: P01
    perm: READ_PHONE_STATE (Android 10+)
    evidence: B
    confirm: getSerial 返回值非 "unknown"；或 SystemProperties key == "ro.serialno"
    fp: 中
    fp_note: Android 10+ getSerial 返回 "unknown"；SystemProperties 需按 key 过滤，否则会误报所有系统属性读取
    policy_alias: [设备序列号, 硬件序列号, 序列号]

  - id: S006
    name: Android ID
    group: 硬件标识
    api:
      - "android.provider.Settings$Secure#getString()"
    pi: P01
    perm: 无
    evidence: B
    confirm: 第二个参数严格等于 "android_id"
    fp: 中
    fp_note: Settings.Secure.getString 是通用方法，必须按 key 精确匹配；这是最高频的误报来源
    policy_alias: [Android ID, 安卓ID, 设备标识符, ANDROID_ID]

  - id: S007
    name: OAID
    group: 硬件标识
    api:
      - "com.bun.miitmdid.core.MdidSdkHelper#InitSdk()"
      - "com.bun.miitmdid.interfaces.IdSupplier#getOAID()"
    match: prefix
    match_prefix: [com.bun.miitmdid, com.heytap.openid, com.huawei.hms.ads, com.bun.lib]
    pi: P01
    perm: 无
    evidence: A
    confirm: getOAID 返回非 null 且非空
    fp: 低
    fp_note: 需内置 MSA SDK 特征类；不同厂商渠道包类名有差异，建议按包名前缀 com.bun / com.heytap.openid / com.huawei.hms.ads 泛匹配
    policy_alias: [OAID, 匿名设备标识符, 设备标识符]

  - id: S008
    name: VAID
    group: 硬件标识
    api:
      - "com.bun.miitmdid.interfaces.IdSupplier#getVAID()"
      - "com.vivo.identifier.IdentifierIdClient#getIdentifier()"
    match: prefix
    match_prefix: [com.bun.miitmdid, com.vivo.identifier]
    pi: P01
    perm: 无
    evidence: A
    confirm: 返回值非 null 且非空
    fp: 低
    fp_note: 仅 vivo 渠道有值
    policy_alias: [VAID, 设备标识符]

  - id: S009
