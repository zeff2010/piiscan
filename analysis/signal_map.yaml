    confirm: 返回值非 null 且非 "<unknown ssid>"
    fp: 低
    fp_note: 未连接 WiFi 时返回 <unknown ssid>，需过滤
    policy_alias: [SSID, WiFi名称, 无线网络名称]

  - id: S014
    name: CPU序列号
    group: 硬件标识
