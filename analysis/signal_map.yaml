      - "okhttp3.internal.connection.RealCall#execute()"
      - "com.android.volley.toolbox.HurlStack#execute()"
    match: prefix
    match_prefix: [com.android.okhttp, okhttp3, com.android.volley]
    verified: "2026-10-15 真机确认：java.net.HttpURLConnection 仅为抽象层，真实实现为 com.android.okhttp.internal.huc.HttpURLConnectionImpl / HttpsURLConnectionImpl（Android 12 实测存在，共 134 个 com.android.okhttp 类）。只 hook java.net 层会漏掉大量请求，必须同时 hook 这两个类。"
    pi: null
    perm: INTERNET
    evidence: C
    confirm: 需截获请求体并匹配敏感字段
    fp: 高
    fp_note: 这是判定"数据出境/第三方共享"的入口，但必须配合 mitmproxy 解密与字段分析，单靠 hook 无法定论
