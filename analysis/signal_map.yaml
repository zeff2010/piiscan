    pi: P03
    perm: 无
    evidence: C
    confirm: 文件路径严格等于 /proc/sys/kernel/random/boot_id
    fp: 中
    fp_note: 路径唯一，按路径过滤后误报低；但需 native hook
    policy_alias: [Boot ID, 设备标识符]

