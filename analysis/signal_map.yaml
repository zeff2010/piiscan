# ============================================================================
# 采集信号映射表 —— 采集项 ↔ 运行时 API ↔ 个人信息类型
# ----------------------------------------------------------------------------
# 来源：
#   1. 现场检测人员常用的人工采集项（2026-10-15）—— 5 列共 86 项
#   2. GB/T 42582-2023 / 个人信息保护法 / App违法违规收集使用个人信息行为认定方法
#   3. 196 份人工检测报告的措辞习惯（policy_alias 字段）
#
# 用途：
#   - 作为 Frida 采集脚本的 hook 清单来源
#   - 作为「实测行为 → 个人信息类型」的归一化字典（政策对齐的输入）
#   - 作为报告输出的术语层（与人工检测的用词一致，检测人员零学习成本）
#
# ============================================================================
# 【误报控制的核心机制】
# ----------------------------------------------------------------------------
# 「API 被调用」≠「个人信息被收集」。仅凭 hook 命中就报违规，误报率会很高。
# 因此每条信号都标注 evidence 等级与 confirm 条件，采集时按三段式判定：
#
#   ① 调用发生   —— hook 命中（必要但不充分）
#   ② 取到有效值 —— 返回值非 null / 非默认占位值（如 Android 10+ 的 IMEI 返回 null）
#   ③ 有去向下落 —— 该值后续进入 网络上报 / 持久化存储 / 日志 / 跨进程传递
#
#   ① 单独成立 → 只作为「线索」，不进报告
#   ① + ②     → 可作为「尝试收集」计入证据
#   ① + ② + ③ → 可作为「实际收集」直接支撑结论 ← 报告只认这一档
#
# 返回值黑名单（取到这些值等同于没取到）：
#   null, "", "unknown", "0", "000000000000000", "02:00:00:00:00:00",
#   "00000000-0000-0000-0000-000000000000", "android", "1"
# ============================================================================

version: 1
updated: "2026-10-15"

meta:
  source_ui: 人工检测采集项
  total_ui_items: 86
  columns: [硬件标识, 模组信息, 用户信息, 操作手机, 网络信息]
  priority_columns: [硬件标识, 用户信息]   # 用户反馈：使用最多

# ----------------------------------------------------------------------------
# 真机验证结果（2026-10-15，Redmi K30 / Android 12 / 靶子 App bin.mt.plus）
# ----------------------------------------------------------------------------
verification:
  declared_hook_points: 139
  verified_exists: 126
  unresolved: 13
  unresolved_reason: "全部为第三方 SDK 类（MSA/OAID、GMS、AndroidX、OkHttp、Volley、友盟），
    是否可解析取决于目标 App 集成了哪个 SDK —— 属预期行为，非映射表错误"
  framework_coverage: "框架级 hook 点 100% 存在，并已取得精确重载签名"
  requires_prefix_match: 9
  key_finding: "java.net.HttpURLConnection 仅为抽象层，真实实现是
    com.android.okhttp.internal.huc.HttpURLConnectionImpl / HttpsURLConnectionImpl。
    只 hook java.net 层会漏掉大量真实请求（真机实测 com.android.okhttp 下有 134 个类）。"
  tooling: [tools/probe_api.py, tools/discover_sdk.py, tools/verify_report.py]
  report: analysis/signal_map_verified.md

# ----------------------------------------------------------------------------
# 匹配策略
# ----------------------------------------------------------------------------
match_strategies:
  exact: 直接按类名 + 方法名 hook，适用于框架类（已全部真机验证）
  prefix: 枚举已加载类 → 按包名前缀筛选 → 在候选类中查找目标方法后 hook。
    适用于第三方 SDK（类名随 SDK 版本/厂商渠道变化，写死会漏报）
  native: 通过 libc hook 文件读取并按路径过滤（CPU序列号、Boot ID）
  arg_filter: 方法本身语义宽泛，须按参数值过滤（如 ContentResolver.query 按 Uri、Settings.Secure 按 key）

# ----------------------------------------------------------------------------
# 证据等级
# ----------------------------------------------------------------------------
evidence_levels:
  A:
    name: 直接证据
    desc: API 语义唯一，返回值即目标数据本身
    confirm: 返回值非空且不在黑名单内
  B:
    name: 条件证据
    desc: API 语义宽泛，须结合参数或返回值进一步判定
    confirm: 参数或返回值匹配到具体 key / 类型
  C:
    name: 间接证据
    desc: 只能推断，不能单独定论；必须叠加落地或上报证据
    confirm: ①+②+③ 三段式全部成立

# ----------------------------------------------------------------------------
# 去向下落（sink）—— 用于把「尝试收集」升级为「实际收集」
# ----------------------------------------------------------------------------
sinks:
  - id: K1
    name: 网络上报
    api:
      - "java.net.URL#openConnection()"
      - "java.net.HttpURLConnection#connect()"
      - "okhttp3.internal.connection.RealCall#execute()"
      - "java.net.Socket#<init>()"
    note: 最有力的证据 —— 数据离开设备。需配合 mitmproxy 确认字段内容
  - id: K2
    name: 持久化存储
    api:
      - "android.database.sqlite.SQLiteDatabase#insert()"
      - "android.database.sqlite.SQLiteDatabase#execSQL()"
      - "android.app.SharedPreferencesImpl$EditorImpl#putString()"
      - "java.io.FileOutputStream#<init>()"
    note: 数据被写入本地库/文件/SharedPrefs，说明确实留存了
  - id: K3
    name: 日志输出
    api:
      - "android.util.Log#d()"
      - "android.util.Log#i()"
      - "android.util.Log#e()"
    note: 敏感数据进日志本身也是风险点，但证据力弱于 K1/K2
  - id: K4
    name: 跨进程传递
    api:
      - "android.content.Intent#putExtra()"
      - "android.os.Bundle#putString()"
    note: 用于判断是否传给第三方 SDK

