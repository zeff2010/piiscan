# ============================================================================
# 信号到测评项的喂给关系（用于自动判定）
# ============================================================================
feeds:
  Q001:  # 未公开收集使用规则
    rule: 首启无隐私政策弹窗，但已出现 evidence>=A 的信号
    signals: [S001-S097 全部]
  Q002:  # 征得同意前收集
    rule: 信号时间戳早于「同意事件」
    signals: [除 S062/S067/S068/S071/S072/S076/S088/S092/S096 等纯行为项外的全部]
  Q003:  # 未经用户同意收集（未在政策声明）
    rule: 信号的 pi 类型不在政策声明的收集项集合中
    signals: [全部含 pi 字段的信号]
  Q010:  # 超出必要范围 / 无关场景
    rule: 信号发生时所在界面与 pi 类型无业务关联
    signals: [P04 位置, P05 通讯录, P06 通信记录, P07 应用信息]
  Q011:  # 超出最低必要频率
    rule: 单位时间内同一信号被触发次数超阈值
    signals: [全部]
  Q012:  # 提前索要非当前功能权限
    rule: S069 记录的权限名与当时界面功能不匹配
    signals: [S069]
  Q023:  # 关闭个性化推荐后未停止收集
    rule: 关闭动作之后仍出现广告/画像相关 SDK 的信号
    signals: [S007-S010, S052, S055]
  Q025:  # 未加密/去标识化
    rule: 反向 —— S062 命中说明已加密，可用于排除该违规
    signals: [S062]

# ============================================================================
# 已识别的重复计数风险（须在采集层归并，否则直接推高误报）
# ============================================================================
dedup_rules:
  - members: [S006, S074]
    note: Settings.Secure.getString 同时出现在"Android ID"与"读系统设置"，按 key 归并
  - members: [S055, S074]
    note: SystemProperties 与 Settings 合并为"系统属性读取"，按 key 白名单统一
  - members: [S011, S089]
    note: getConnectionInfo 与其后续字段读取归并为一次
  - members: [S080, S081, S082]
    note: 同一 HTTP 请求会同时触发三者，按 URI 归并为一次网络上报
  - members: [S022, S028]
    note: 网络类型读取归并为一次
  - members: [S012, S013, S087]
    note: WiFi 相关归并为"WiFi 信息收集"，但 BSSID/SSID 与扫描列表分开计数
