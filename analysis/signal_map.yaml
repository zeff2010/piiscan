      - "com.asus.msa.SupplementaryDID.SupplementaryDIDManager#getAAID()"
    match: prefix
    match_prefix: [com.bun.miitmdid, com.asus.msa]
    pi: P01
    perm: 无
    evidence: A
    confirm: 返回值非 null 且非空
    fp: 低
    fp_note: 仅华硕渠道有值
    policy_alias: [AAID, 设备标识符]

  - id: S010
    name: GAID
    group: 硬件标识
    api:
      - "com.google.android.gms.ads.identifier.AdvertisingIdClient#getAdvertisingIdInfo()"
    match: prefix
    match_prefix: [com.google.android.gms.ads]
    pi: P01
    perm: 无
    evidence: A
    confirm: 返回的 AdvertisingIdClient.Info#getId() 非 null 且非全 0 UUID
    fp: 低
    fp_note: 无 GMS 的设备返回异常，需容错
    policy_alias: [GAID, 广告标识符, Google Advertising ID, 广告ID]

  - id: S011
    name: MAC地址
    group: 硬件标识
    api:
      - "android.net.wifi.WifiInfo#getMacAddress()"
      - "java.net.NetworkInterface#getHardwareAddress()"
    pi: P01
    perm: ACCESS_WIFI_STATE
    evidence: B
    confirm: 返回值非 "02:00:00:00:00:00"
    fp: 中
    fp_note: Android 6+ 该 API 固定返回 02:00:00:00:00:00（即已被系统阻断）。若 App 仅调到该 API 但取到占位值，属"尝试收集"而非"实际收集"。真实 MAC 需 native 读 /sys/class/net/*/address，判定难度大
    policy_alias: [MAC地址, 网卡地址, 物理地址]

  - id: S012
    name: BSSID
    group: 硬件标识
    api:
      - "android.net.wifi.WifiInfo#getBSSID()"
    pi: P02
